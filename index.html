<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111318"><title>موفي بوكس — اكتشف ما تشاهده</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="topbar"><a class="brand" href="#home"><span class="brand-mark">M</span><span>موفي<span class="accent">بوكس</span></span></a>
    <nav><a class="nav-link active" href="#home">الرئيسية</a><a class="nav-link" href="#movies">أفلام</a><a class="nav-link" href="#series">مسلسلات</a></nav>
    <form id="search-form" class="search"><span>⌕</span><input id="search-input" placeholder="ابحث عن فيلم أو مسلسل" autocomplete="off"><kbd>↵</kbd></form>
  </header>
  <main id="app"><section class="hero" id="hero"><div class="hero-copy"><p class="eyebrow">مساحة اكتشافك الجديدة</p><h1>قصتك القادمة<br><span>تبدأ من هنا.</span></h1><p class="hero-desc">اكتشف عالماً من الأفلام والمسلسلات، واختر ما يناسب مزاجك.</p><button class="primary" id="explore">استكشف الآن <b>←</b></button></div><div class="hero-art"><div class="art-glow"></div><div class="poster poster-back"></div><div class="poster poster-front"><span>NOW<br>SHOWING</span></div><div class="floating-tag">✦ اختيارات اليوم</div></div><div class="hero-dots"><i></i><i></i><i></i></div></section>
    <section class="toolbar"><div><p class="eyebrow">استكشف المكتبة</p><h2>ماذا تشاهد اليوم؟</h2></div><div class="filters"><button class="chip selected" data-kind="all">الكل</button><button class="chip" data-kind="movie">أفلام</button><button class="chip" data-kind="tv">مسلسلات</button><button class="chip" data-kind="trending">الأكثر مشاهدة</button></div></section>
    <div id="status" class="status"><span class="pulse"></span> جارٍ تحميل المحتوى…</div>
    <section class="content-section"><div class="section-title"><h2 id="section-heading">مختارات لك</h2><button id="refresh" class="text-button">تحديث ↻</button></div><div id="grid" class="grid"></div></section>
    <section class="content-section"><div class="section-title"><h2>تصفح حسب النوع</h2></div><div id="genres" class="genres"><button data-genre="Action">أكشن <span>↖</span></button><button data-genre="Comedy">كوميديا <span>↖</span></button><button data-genre="Drama">دراما <span>↖</span></button><button data-genre="Horror">رعب <span>↖</span></button><button data-genre="Romance">رومانسي <span>↖</span></button></div></section>
    <footer><span class="brand"><span class="brand-mark">M</span> موفي بوكس</span><span>واجهة اكتشاف للمحتوى</span></footer>
  </main>
  <dialog id="detail"><button class="close" aria-label="إغلاق">×</button><div id="detail-body"></div></dialog>
  <script src="./app.js"></script>
</body></html>
